apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nuclio
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://nuclio.github.io/nuclio/charts
    chart: nuclio
    targetRevision: 0.23.4
    helm:
      values: |
        controller:
          enabled: true
          image:
            repository: quay.io/nuclio/controller
            tag: 1.15.27-arm64
            pullPolicy: IfNotPresent

        dashboard:
          enabled: true
          replicas: 1
          servicePort: 8070
          # OKE에 docker daemon이 없으므로 in-cluster 빌더(kaniko) 사용.
          # docker(기본값)면 시작 시 /var/run/docker.sock 연결 실패로 크래시
          containerBuilderKind: kaniko
          image:
            repository: quay.io/nuclio/dashboard
            tag: 1.15.27-arm64
            pullPolicy: IfNotPresent
          # Cloudflare Access가 로그인을 담당 (ArgoCD와 동일한 패턴)
          authConfig:
            kind: nop
          ingress:
            enabled: true
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            path: /
            hosts:
              - nuclio.simproject.kr
            tls:
              - secretName: nuclio-tls
                hosts:
                  - nuclio.simproject.kr
            ingressClassName: nginx

        rbac:
          create: true
          crdAccessMode: namespaced

  destination:
    server: https://kubernetes.default.svc
    namespace: nuclio

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
