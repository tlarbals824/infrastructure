apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-nuclio
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  sources:
    - repoURL: https://nuclio.github.io/nuclio/charts
      chart: nuclio
      targetRevision: 0.23.4
      helm:
        values: |
          controller:
            enabled: true
            image:
              repository: quay.io/nuclio/controller
              tag: 1.15.27-arm64
              pullPolicy: IfNotPresent

          dashboard:
            enabled: true
            replicas: 1
            servicePort: 8070
            # OKE에 docker daemon이 없으므로 in-cluster 빌더(kaniko) 사용.
            containerBuilderKind: kaniko
            image:
              repository: quay.io/nuclio/dashboard
              tag: 1.15.27-arm64
              pullPolicy: IfNotPresent
            # Cloudflare Access가 로그인을 담당한다.
            authConfig:
              kind: nop
            ingress:
              enabled: false

          rbac:
            create: true
            crdAccessMode: namespaced
    - repoURL: https://github.com/tlarbals824/infrastructure.git
      targetRevision: main
      path: k8s/infra/nuclio

  destination:
    server: https://kubernetes.default.svc
    namespace: nuclio

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
