apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-traefik
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.0
    helm:
      values: |
        # SealedSecret crowdsec-bouncer-key 가 ingress-nginx 네임스페이스에 묶여 있다.
        # 키를 다시 봉인하지 않으려고 Traefik 도 같은 네임스페이스에 둔다.
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik
        gateway:
          enabled: false
        gatewayClass:
          enabled: true
          name: traefik
        experimental:
          plugins:
            bouncer:
              moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
              version: v1.4.5
        providers:
          kubernetesCRD:
            allowCrossNamespace: true
          kubernetesGateway:
            enabled: true
          # cert-manager HTTP-01 은 임시 Ingress 로 받는다.
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
        volumes:
          - name: crowdsec-bouncer-key
            mountPath: /etc/traefik/crowdsec
            type: secret
            secretName: crowdsec-bouncer-key
        # NLB 가 소스 IP 를 보존한다. externalTrafficPolicy Local 이라
        # 파드가 보는 주소는 Cloudflare 엣지고, X-Forwarded-For 는 클라이언트다.
        # CIDR 는 https://www.cloudflare.com/ips-v4 (2026-09-24).
        ports:
          web:
            allowACMEByPass: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
            forwardedHeaders:
              trustedIPs:
                - 173.245.48.0/20
                - 103.21.244.0/22
                - 103.22.200.0/22
                - 103.31.4.0/22
                - 141.101.64.0/18
                - 108.162.192.0/18
                - 190.93.240.0/20
                - 188.114.96.0/20
                - 197.234.240.0/22
                - 198.41.128.0/17
                - 162.158.0.0/15
                - 104.16.0.0/13
                - 104.24.0.0/14
                - 172.64.0.0/13
                - 131.0.72.0/22
          websecure:
            forwardedHeaders:
              trustedIPs:
                - 173.245.48.0/20
                - 103.21.244.0/22
                - 103.22.200.0/22
                - 103.31.4.0/22
                - 141.101.64.0/18
                - 108.162.192.0/18
                - 190.93.240.0/20
                - 188.114.96.0/20
                - 197.234.240.0/22
                - 198.41.128.0/17
                - 162.158.0.0/15
                - 104.16.0.0/13
                - 104.24.0.0/14
                - 172.64.0.0/13
                - 131.0.72.0/22
        accessLog:
          enabled: true
          format: json
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: infra-traefik
        service:
          annotations:
            oci.oraclecloud.com/load-balancer-type: "nlb"
          spec:
            type: LoadBalancer
            loadBalancerIP: "134.185.104.125"
            externalTrafficPolicy: Local

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
