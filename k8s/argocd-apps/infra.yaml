apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-argo-rollouts
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.39.1
    helm:
      values: |
        dashboard:
          enabled: true
        controller:
          replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/preserveUnknownFields
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-ingress-nginx
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.1
    helm:
      values: |
        controller:
          # CrowdSec Lua bouncer 지원 이미지 (mainline v1.12+에서 Lua 제거됨)
          image:
            registry: docker.io
            image: crowdsecurity/controller
            tag: v1.13.2
            digest: sha256:4575be24781cad35f8e58437db6a3f492df2a3167fed2b6759a6ff0dc3488d56
          replicaCount: 2
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0
              maxSurge: 1
          minAvailable: 1
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: infra-ingress-nginx
                  app.kubernetes.io/component: controller
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          config:
            lua-shared-dicts: "crowdsec_cache: 50m"
            plugins: "crowdsec"
            # NLB 가 소스 IP 를 보존하므로 nginx 가 보는 주소는 Cloudflare 엣지다.
            # CF-Connecting-IP 를 클라이언트 주소로 써야 CrowdSec 이 엣지 IP 를 차단하지 않는다.
            # CIDR 목록은 https://www.cloudflare.com/ips-v4 (2026-09-24).
            use-forwarded-headers: "true"
            forwarded-for-header: "CF-Connecting-IP"
            proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
          extraVolumes:
            - name: crowdsec-bouncer-plugin
              emptyDir: {}
          extraVolumeMounts:
            - name: crowdsec-bouncer-plugin
              mountPath: /etc/nginx/lua/plugins/crowdsec
              readOnly: true
          extraInitContainers:
            - name: init-crowdsec-bouncer
              image: index.docker.io/crowdsecurity/lua-bouncer-plugin:v1.1.2
              env:
                - name: API_URL
                  value: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: crowdsec-bouncer-key
                      key: BOUNCER_KEY
                - name: BOUNCER_CONFIG
                  value: "/crowdsec/crowdsec-bouncer.conf"
                - name: BAN_TEMPLATE_PATH
                  value: "/etc/nginx/lua/plugins/crowdsec/templates/ban.html"
                - name: CAPTCHA_TEMPLATE_PATH
                  value: "/etc/nginx/lua/plugins/crowdsec/templates/captcha.html"
              command: ["sh", "-c", "sh /docker_start.sh && cp -R /crowdsec/* /lua_plugins/crowdsec/"]
              volumeMounts:
                - name: crowdsec-bouncer-plugin
                  mountPath: /lua_plugins/crowdsec
          service:
            loadBalancerIP: "134.185.104.125"
            annotations:
              oci.oraclecloud.com/load-balancer-type: "nlb"

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
