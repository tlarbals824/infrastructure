apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: ingress-nginx-bouncer@kubernetescrd
    # Traefik 이 Let's Encrypt 인증서로 TLS 를 종료하고, Argo CD 에는 HTTPS 로 다시 연결한다.
    traefik.ingress.kubernetes.io/service.serversscheme: https
    # allowCrossNamespace 가 켜져 있으면 참조 이름 앞에 네임스페이스가 붙는다.
    traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-backend@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.simproject.kr
      secretName: argocd-server-tls
  rules:
    - host: argocd.simproject.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
