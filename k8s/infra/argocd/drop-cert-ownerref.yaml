apiVersion: v1
kind: ServiceAccount
metadata:
  name: drop-cert-ownerref
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drop-cert-ownerref
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drop-cert-ownerref
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drop-cert-ownerref
subjects:
  - kind: ServiceAccount
    name: drop-cert-ownerref
---
apiVersion: batch/v1
kind: Job
metadata:
  name: drop-cert-ownerref
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: drop-cert-ownerref
      restartPolicy: Never
      containers:
        - name: kubectl
          image: docker.io/bitnami/kubectl:1.32.4
          env:
            - name: CERT_NAME
              value: argocd-server-tls
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              if ! kubectl get certificate "$CERT_NAME" >/dev/null 2>&1; then
                exit 0
              fi
              owners=$(kubectl get certificate "$CERT_NAME" -o jsonpath='{.metadata.ownerReferences}')
              if [ -n "$owners" ]; then
                kubectl patch certificate "$CERT_NAME" --type=json -p='[{"op":"remove","path":"/metadata/ownerReferences"}]'
              fi
