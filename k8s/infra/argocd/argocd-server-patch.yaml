apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    metadata:
      annotations:
        infrastructure/server-insecure: "true"
    spec:
      initContainers:
        - name: argo-rollouts-extension
          image: quay.io/argoprojlabs/argocd-extension-installer:v1.1.0
          env:
            - name: EXTENSION_NAME
              value: argo-rollouts
            - name: EXTENSION_VERSION
              value: v0.4.1
            - name: EXTENSION_URL
              value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.1/extension.tar
            - name: EXTENSIONS_DIR
              value: /tmp/extensions
          volumeMounts:
            - name: extensions
              mountPath: /tmp/extensions/
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
      containers:
        - name: argocd-server
          volumeMounts:
            - name: extensions
              mountPath: /tmp/extensions/
      volumes:
        - name: extensions
          emptyDir: {}
