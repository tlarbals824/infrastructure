# 하루 한 번 obsidian 데이터베이스를 덤프하고 최근 5개만 남긴다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: livesync-backup
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: livesync
    app.kubernetes.io/part-of: infra
spec:
  schedule: "15 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: livesync-backup
            app.kubernetes.io/part-of: infra
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: docker.io/library/node:22.21.0-alpine
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  npm install --omit=dev --no-audit --no-fund @cloudant/couchbackup@2.3.0
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  ./node_modules/.bin/couchbackup \
                    --url "http://admin:${ADMIN_PASSWORD}@livesync.crowdsec.svc.cluster.local:5984" \
                    --db obsidian \
                    > "/work/${stamp}.txt"
              env:
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: livesync-auth
                      key: admin-password
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.31.19
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  shopt -s nullglob
                  files=(/work/*.txt)
                  if [ "${#files[@]}" -ne 1 ]; then
                    echo "expected one dump, found ${#files[@]}" >&2
                    exit 1
                  fi
                  name=$(basename "${files[0]}")
                  aws s3api put-object \
                    --bucket livesync-backup \
                    --key "obsidian/${name}" \
                    --body "${files[0]}" \
                    --endpoint-url "$AWS_ENDPOINT_URL" \
                    --region ap-chuncheon-1 >/dev/null
                  mapfile -t keys < <(aws s3api list-objects-v2 \
                    --bucket livesync-backup \
                    --prefix obsidian/ \
                    --query 'Contents[].Key' \
                    --output text \
                    --endpoint-url "$AWS_ENDPOINT_URL" \
                    --region ap-chuncheon-1 | tr '\t' '\n' | sed '/^$/d' | sort)
                  total=${#keys[@]}
                  if [ "$total" -le 5 ]; then
                    exit 0
                  fi
                  delete_count=$((total - 5))
                  for ((i = 0; i < delete_count; i++)); do
                    aws s3api delete-object \
                      --bucket livesync-backup \
                      --key "${keys[$i]}" \
                      --endpoint-url "$AWS_ENDPOINT_URL" \
                      --region ap-chuncheon-1 >/dev/null
                  done
              env:
                - name: AWS_ENDPOINT_URL
                  value: https://axgu3qzufd5m.compat.objectstorage.ap-chuncheon-1.oraclecloud.com
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: livesync-backup
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: livesync-backup
                      key: secret-access-key
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
