# In-cluster OCI registry for Nuclio function images.
# Storage is core-pvc subPath registry. The claim is ReadWriteOnce, so this
# pod must stay on the same node as CrowdSec LAPI, which already mounts it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: infra
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  k8s-app: infra-crowdsec
                  type: lapi
              topologyKey: kubernetes.io/hostname
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
              subPath: registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: core-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: infra
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
---
# Worker nodes resolve DNS with the VCN resolver, not CoreDNS, so CRI-O cannot
# pull registry.crowdsec.svc.cluster.local:5000 unless this DaemonSet publishes
# the ClusterIP in /etc/hosts and allows plain HTTP in registries.conf.d.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-node-config
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: registry-node-config
    app.kubernetes.io/part-of: infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-node-config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-node-config
        app.kubernetes.io/part-of: infra
    spec:
      hostPID: true
      containers:
        - name: configure
          image: docker.io/library/busybox:1.36
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOST=registry.crowdsec.svc.cluster.local
              PORT=5000
              MARK="# cluster-registry"
              CONF_DIR=/host/etc/containers/registries.conf.d
              CONF="$CONF_DIR/99-cluster-registry.conf"
              HOSTS=/host/etc/hosts
              while true; do
                # busybox has nslookup, not getent. The resolver line is
                # "Address: <dns-ip>:53", so take the Address after Name.
                ip=$(nslookup "$HOST" 2>/dev/null | awk '/^Name:/{found=1; next} found && /^Address:/{print $2; exit}')
                if [ -z "$ip" ]; then
                  echo "waiting for $HOST"
                  sleep 5
                  continue
                fi
                mkdir -p "$CONF_DIR"
                tmp_hosts=$(mktemp)
                awk -v mark="$MARK" 'index($0, mark) == 0 { print }' "$HOSTS" > "$tmp_hosts"
                echo "$ip $HOST $MARK" >> "$tmp_hosts"
                if ! cmp -s "$tmp_hosts" "$HOSTS"; then
                  cat "$tmp_hosts" > "$HOSTS"
                  echo "updated hosts $ip $HOST"
                fi
                rm -f "$tmp_hosts"
                tmp_conf=$(mktemp)
                printf '%s\n' '[[registry]]' "location = \"${HOST}:${PORT}\"" 'insecure = true' > "$tmp_conf"
                if ! cmp -s "$tmp_conf" "$CONF"; then
                  cat "$tmp_conf" > "$CONF"
                  echo "updated $CONF"
                  pid=$(ps -o pid,comm | awk '$2 == "crio" { print $1; exit }')
                  if [ -n "$pid" ]; then
                    kill -HUP "$pid" || true
                    echo "reloaded crio $pid"
                  fi
                fi
                rm -f "$tmp_conf"
                sleep 60
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: etc
              mountPath: /host/etc
      volumes:
        - name: etc
          hostPath:
            path: /etc
            type: Directory
