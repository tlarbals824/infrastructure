- op: add
  path: /spec/listeners/-
  value:
    name: https-livesync
    protocol: HTTPS
    port: 8443
    hostname: livesync.simproject.kr
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - group: ""
          kind: Secret
          name: livesync-tls
          namespace: crowdsec
