name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

env:
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_CLI_TENANCY }}
  TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER }}
  TF_VAR_fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Terraform Init
        run: terraform init

      - name: Import existing Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          api_base="https://api.cloudflare.com/client/v4"
          zone_id="${TF_VAR_cloudflare_zone_id}"
          account_id="${TF_VAR_cloudflare_account_id}"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          app_response="$(mktemp)"
          curl --fail --silent --show-error \
            -H "${auth_header}" \
            -H "Content-Type: application/json" \
            "${api_base}/zones/${zone_id}/access/apps?per_page=100" > "${app_response}"

          app_id="$(jq -r '.result[] | select(.name == "ArgoCD" and .domain == "argocd.simproject.kr") | .id' "${app_response}" | head -n 1)"
          test -n "${app_id}" && test "${app_id}" != "null"

          if ! terraform state list | grep -Fxq 'cloudflare_access_application.argocd'; then
            terraform import "cloudflare_access_application.argocd" "${account_id}/${app_id}"
          fi

          dns_response="$(mktemp)"
          curl --fail --silent --show-error \
            -H "${auth_header}" \
            -H "Content-Type: application/json" \
            "${api_base}/zones/${zone_id}/dns_records?type=A&name=argocd.simproject.kr&per_page=100" > "${dns_response}"

          record_id="$(jq -r '.result[] | .id' "${dns_response}" | head -n 1)"
          test -n "${record_id}" && test "${record_id}" != "null"

          if ! terraform state list | grep -Fxq 'cloudflare_record.argocd'; then
            terraform import "cloudflare_record.argocd" "${zone_id}/${record_id}"
          fi

          policy_response="$(mktemp)"
          curl --fail --silent --show-error \
            -H "${auth_header}" \
            -H "Content-Type: application/json" \
            "${api_base}/zones/${zone_id}/access/apps/${app_id}/policies?per_page=100" > "${policy_response}"

          policy_id="$(jq -r '.result[] | select(.name == "Personal Access") | .id' "${policy_response}" | head -n 1)"
          if [ -n "${policy_id}" ] && [ "${policy_id}" != "null" ] && ! terraform state list | grep -Fxq 'cloudflare_access_policy.argocd'; then
            terraform import "cloudflare_access_policy.argocd" "zone/${zone_id}/${app_id}/${policy_id}"
          fi

      - name: Terraform Apply
        run: terraform apply -auto-approve
