name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_CLI_TENANCY }}
  TF_VAR_user_ocid: ${{ secrets.OCI_CLI_USER }}
  TF_VAR_fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Terraform Init
        run: terraform init -lockfile=readonly

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee /tmp/tfplan-output.txt
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.plan.outcome }}';
            const planOutput = fs.readFileSync('/tmp/tfplan-output.txt', 'utf8') || '';
            const truncatedOutput = planOutput.slice(0, 60000);

            let body;
            if (outcome === 'success') {
              body = `#### Terraform Plan\n\`\`\`\n${truncatedOutput}\n\`\`\`\n*Pushed by: @${{ github.actor }}*`;
            } else {
              body = `#### Terraform Plan Failed\n\`\`\`\n${truncatedOutput}\n\`\`\`\n*Pushed by: @${{ github.actor }}*`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      - name: Reject replacement of billed resources
        if: steps.plan.outcome == 'success'
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("/tmp/tfplan-output.txt", encoding="utf-8", errors="replace").read()
          pattern = re.compile(
              r"^.*# (oci_containerengine_cluster|oci_containerengine_node_pool|oci_core_vcn|oci_core_nat_gateway|oci_core_internet_gateway|oci_core_service_gateway|oci_core_subnet)\.[^\n]*(must be replaced|will be destroyed).*$",
              re.M,
          )
          hits = list(pattern.finditer(text))
          if hits:
              print("Refusing a plan that would replace or destroy OCI resources. Replacement leaves instances, boot volumes, NAT gateways, or load balancers outside Terraform state.")
              for hit in hits:
                  print(hit.group(0))
              sys.exit(1)
          PY

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
